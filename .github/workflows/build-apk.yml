name: Compilar APK Mixpak System

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Compilar la app web
        run: npm run build

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sincronizar o añadir plataforma Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: cd android && ./gradlew assembleDebug

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-mixpak-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
